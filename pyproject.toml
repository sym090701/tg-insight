[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-insight"
version = "0.1.25"
description = "Lightweight Telegram group archive, daily digest, and grounded history Q&A"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.13.3",
  "openai==2.54.0",
  "telethon==1.44.0",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
tg-insight = "tg_insight.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
